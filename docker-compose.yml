# Local save database for Hearthborn.
#   docker compose up -d      start MongoDB (data persists in the "hearthborn-mongo" volume)
#   docker compose down       stop it (data is kept); add -v to wipe the saves
services:
  mongo:
    image: mongo:7
    container_name: hearthborn-mongo
    restart: unless-stopped
    ports:
      - "27018:27017"        # 27018 on this machine: 27017 is used by another project
    volumes:
      - hearthborn-mongo:/data/db
    healthcheck:
      # mongod itself answering on its port is enough; mongosh is a heavy Node process and spawning it every
      # 10 s ate a whole CPU core (and timed out) whenever the machine was busy.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/27017' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
volumes:
  hearthborn-mongo:
